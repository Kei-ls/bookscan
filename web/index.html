<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bookscan</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">Bookscan</div>
  <div class="project">
    <label>프로젝트</label>
    <select id="projectSelect"></select>
    <button id="newProject" class="ghost" title="새 프로젝트">＋</button>
  </div>
  <div class="spacer"></div>
  <button id="revealBtn" class="ghost">출력 폴더 열기</button>
  <button id="cameraBtn" class="ghost">카메라</button>
  <button id="pdfBtn" class="primary">PDF 만들기</button>
</header>

<div id="toast" class="toast" hidden></div>

<main>
  <section id="importBar" class="importbar">
    <div class="row">
      <input id="folderInput" type="text" placeholder="사진이 있는 폴더 경로">
      <button id="importFolder">폴더 가져오기</button>
      <span class="or">또는</span>
      <button id="pickFiles">파일 선택</button>
      <input id="fileInput" type="file" accept="image/*" multiple hidden>
    </div>
    <div id="progress" class="progress" hidden>
      <div class="bar"><div class="fill"></div></div>
      <span class="label"></span>
    </div>
  </section>

  <section id="grid" class="grid"></section>

  <div id="empty" class="empty">
    <p>아직 페이지가 없습니다.</p>
    <p class="hint">위에 폴더 경로를 넣고 <b>폴더 가져오기</b>를 누르거나, 사진 파일을 이 창에 끌어다 놓으세요.</p>
  </div>
</main>

<!-- 편집 패널 -->
<div id="editor" class="overlay" hidden>
  <div class="panel editor-panel">
    <header>
      <h2 id="editTitle">페이지 편집</h2>
      <button class="close" data-close>✕</button>
    </header>
    <div class="editor-body">
      <div class="canvas-wrap">
        <canvas id="cornerCanvas"></canvas>
        <p class="hint">모서리 점을 끌어서 페이지 영역을 맞추세요.</p>
      </div>
      <div class="editor-side">
        <img id="editPreview" class="preview" alt="결과 미리보기">
        <div id="editNotes" class="notes"></div>

        <div class="field">
          <label>출력</label>
          <div class="seg" id="modeSeg">
            <button data-mode="color">컬러</button>
            <button data-mode="gray">회색조</button>
            <button data-mode="bw">흑백</button>
          </div>
        </div>

        <div class="field">
          <label>회전</label>
          <div class="btns">
            <button data-rotate="-90">↶ 90°</button>
            <button data-rotate="90">↷ 90°</button>
            <button data-rotate="180">180°</button>
          </div>
        </div>

        <div class="field">
          <label>펼침면</label>
          <div class="seg" id="spreadSeg">
            <button data-spread="auto">자동</button>
            <button data-spread="single">한 면</button>
            <button data-spread="split">두 면 분할</button>
          </div>
        </div>

        <div class="field" id="gutterField">
          <label>책등 위치 <span id="gutterVal" class="mono"></span></label>
          <input id="gutterRange" type="range" min="20" max="80" step="1">
        </div>

        <div class="field">
          <label class="check">
            <input id="dewarpToggle" type="checkbox"> 곡면 펴기 (dewarp)
          </label>
          <p class="hint small">결과가 이상하면 꺼보세요. 평평한 종이는 자동으로 건너뜁니다.</p>
        </div>

        <div class="field">
          <label>밝기 <span id="brightVal" class="mono">0</span></label>
          <input id="brightRange" type="range" min="-60" max="60" step="5" value="0">
          <label>대비 <span id="contrastVal" class="mono">0</span></label>
          <input id="contrastRange" type="range" min="-60" max="60" step="5" value="0">
        </div>

        <div class="editor-actions">
          <button id="resetCorners" class="ghost">코너 자동 재검출</button>
          <button id="applyEdit" class="primary">적용</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 카메라 패널 -->
<div id="cameraPanel" class="overlay" hidden>
  <div class="panel camera-panel">
    <header>
      <h2>카메라 촬영</h2>
      <button class="close" data-close>✕</button>
    </header>
    <div class="camera-body">
      <div class="row">
        <select id="deviceSelect"></select>
        <button id="openCamera">연결</button>
        <button id="closeCamera" class="ghost">해제</button>
      </div>
      <p id="cameraHint" class="hint"></p>
      <div class="stage">
        <img id="cameraView" alt="라이브 화면">
        <div id="cameraPlaceholder" class="placeholder">카메라를 선택하고 연결을 누르세요.</div>
      </div>
      <div class="row center">
        <button id="captureBtn" class="primary big">촬영 (스페이스바)</button>
        <span id="captureCount" class="mono"></span>
      </div>
    </div>
  </div>
</div>

<!-- PDF 패널 -->
<div id="pdfPanel" class="overlay" hidden>
  <div class="panel small-panel">
    <header>
      <h2>PDF 만들기</h2>
      <button class="close" data-close>✕</button>
    </header>
    <div class="pdf-body">
      <div class="field">
        <label>파일 이름</label>
        <input id="pdfName" type="text" placeholder="내 스캔">
      </div>
      <div class="field">
        <label>용지 크기</label>
        <select id="pdfSize">
          <option value="auto">이미지 비율 그대로 (권장)</option>
          <option value="a4">A4</option>
          <option value="letter">Letter</option>
          <option value="b5">B5</option>
        </select>
      </div>
      <p id="pdfInfo" class="hint"></p>
      <div class="editor-actions">
        <button id="makePdf" class="primary">만들기</button>
      </div>
    </div>
  </div>
</div>

<div id="dropzone" class="dropzone" hidden><span>사진을 놓으면 가져옵니다</span></div>

<script src="/static/app.js"></script>
</body>
</html>
